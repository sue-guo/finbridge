apiVersion: apps/v1
kind: Deployment
metadata:
  name: finbridge
  labels:
    app: finbridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finbridge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: finbridge
    spec:
      containers:
        - name: finbridge
          image: ghcr.io/sue-guo/finbridge:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: bill-manager-secrets
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bill-manager-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bill-manager-secrets
                  key: db-password
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
