version: '3.9'

services:

  app:
    build: .
    image: finbridge:local
    container_name: finbridge
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finbridge
      SPRING_DATASOURCE_USERNAME: billuser
      SPRING_DATASOURCE_PASSWORD: billpass
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: finbridge-postgres
    ports:
      - "5433:5432" #
    environment:
      POSTGRES_DB: finbridge
      POSTGRES_USER: billuser
      POSTGRES_PASSWORD: billpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billuser -d finbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  localstack:
    image: localstack/localstack:3.7
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
