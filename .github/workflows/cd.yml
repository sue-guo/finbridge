name: CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Kubernetes deployment
        run: |
          echo "Deploying image: ${{ steps.tag.outputs.IMAGE_TAG }}"
          # kubectl set image deployment/s3-file-manager \
          #   s3-file-manager=${{ steps.tag.outputs.IMAGE_TAG }}
          # kubectl rollout status deployment/s3-file-manager
          echo "Deploy step - configure kubectl context in production"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
